name: "Bazel Affected-Target Tests"

# Run only the tests affected by a PR's changes, using Bazel's dependency
# graph (bazel query rdeps) to determine the minimal test set. Falls back
# to full CI when foundational paths change (see ci/full_ci_triggers.txt).
#
# This workflow is the primary mechanism for reducing CI time on PRs that
# touch a single module. Expected savings: 60-80% fewer test runs compared
# to running the entire post-commit suite.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test-tag-filter:
        description: "Bazel test tag filter (e.g., post_commit, frequent, slow)"
        required: false
        default: "post_commit"
        type: string
      force-full-ci:
        description: "Force full CI (ignore affected-target analysis)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

jobs:
  # -------------------------------------------------------------------------
  # Phase 1: Determine which test targets are affected by the PR
  # -------------------------------------------------------------------------
  determine-targets:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.query.outputs.mode }}
      affected_tests: ${{ steps.query.outputs.affected_tests }}
      test_count: ${{ steps.query.outputs.test_count }}
      has_host_tests: ${{ steps.classify.outputs.has_host_tests }}
      needs_n150: ${{ steps.classify.outputs.needs_n150 }}
      needs_n300: ${{ steps.classify.outputs.needs_n300 }}
      needs_t3000: ${{ steps.classify.outputs.needs_t3000 }}
      needs_blackhole: ${{ steps.classify.outputs.needs_blackhole }}
      needs_galaxy_wh: ${{ steps.classify.outputs.needs_galaxy_wh }}
      needs_galaxy_bh: ${{ steps.classify.outputs.needs_galaxy_bh }}
      needs_perf_t3000: ${{ steps.classify.outputs.needs_perf_t3000 }}
      needs_perf_tg: ${{ steps.classify.outputs.needs_perf_tg }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate git diff

      - name: Determine affected targets
        id: query
        run: |
          set -euo pipefail

          if [ "${{ inputs.force-full-ci }}" = "true" ]; then
            echo "mode=FULL_CI" >> "$GITHUB_OUTPUT"
            echo "test_count=all" >> "$GITHUB_OUTPUT"
            echo "Force-full-CI requested"
            exit 0
          fi

          # Run the affected-targets script
          RESULT=$(ci/affected_targets.sh \
            "origin/${{ github.base_ref || 'main' }}" \
            "${{ github.sha }}")

          if [ "$RESULT" = "FULL_CI" ]; then
            echo "mode=FULL_CI" >> "$GITHUB_OUTPUT"
            echo "test_count=all" >> "$GITHUB_OUTPUT"
          elif [ "$RESULT" = "SKIP" ]; then
            echo "mode=SKIP" >> "$GITHUB_OUTPUT"
            echo "test_count=0" >> "$GITHUB_OUTPUT"
          else
            echo "mode=AFFECTED" >> "$GITHUB_OUTPUT"
            # Store targets as a space-separated string (GitHub Actions
            # output doesn't support multiline well in expressions).
            TARGETS_ONELINE=$(echo "$RESULT" | tr '\n' ' ')
            echo "affected_tests=$TARGETS_ONELINE" >> "$GITHUB_OUTPUT"
            echo "test_count=$(echo "$RESULT" | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: Classify test targets by hardware needs
        id: classify
        if: steps.query.outputs.mode != 'SKIP'
        run: |
          set -euo pipefail

          MODE="${{ steps.query.outputs.mode }}"

          if [ "$MODE" = "FULL_CI" ]; then
            echo "has_host_tests=true" >> "$GITHUB_OUTPUT"
            echo "needs_n150=true" >> "$GITHUB_OUTPUT"
            echo "needs_n300=true" >> "$GITHUB_OUTPUT"
            echo "needs_t3000=true" >> "$GITHUB_OUTPUT"
            echo "needs_blackhole=true" >> "$GITHUB_OUTPUT"
            echo "needs_galaxy_wh=true" >> "$GITHUB_OUTPUT"
            echo "needs_galaxy_bh=true" >> "$GITHUB_OUTPUT"
            echo "needs_perf_t3000=true" >> "$GITHUB_OUTPUT"
            echo "needs_perf_tg=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TARGETS="${{ steps.query.outputs.affected_tests }}"

          # Classify each target by its hardware requirement tags.
          # A target may match multiple SKUs (e.g., requires_wormhole_b0 + requires_galaxy).
          HAS_HOST="false"
          NEEDS_N150="false"
          NEEDS_N300="false"
          NEEDS_T3000="false"
          NEEDS_BH="false"
          NEEDS_GALAXY_WH="false"
          NEEDS_GALAXY_BH="false"
          NEEDS_PERF_T3000="false"
          NEEDS_PERF_TG="false"

          for target in $TARGETS; do
            TAGS=$(bazel query "attr(tags, '', $target)" --output=xml 2>/dev/null \
              | grep -oP 'value="\K[^"]+' || echo "")

            IS_HW="false"

            if echo "$TAGS" | grep -q "requires_N150"; then
              NEEDS_N150="true"; IS_HW="true"
            fi
            if echo "$TAGS" | grep -q "requires_N300"; then
              NEEDS_N300="true"; IS_HW="true"
            fi
            if echo "$TAGS" | grep -q "requires_T3000"; then
              NEEDS_T3000="true"; IS_HW="true"
            fi

            # Galaxy tests carry requires_galaxy plus an arch tag
            if echo "$TAGS" | grep -q "requires_galaxy"; then
              if echo "$TAGS" | grep -q "requires_blackhole"; then
                NEEDS_GALAXY_BH="true"
              else
                NEEDS_GALAXY_WH="true"
              fi
              IS_HW="true"
            fi

            # Blackhole non-Galaxy tests
            if echo "$TAGS" | grep -q "requires_blackhole"; then
              if ! echo "$TAGS" | grep -q "requires_galaxy"; then
                NEEDS_BH="true"
              fi
              IS_HW="true"
            fi

            # Wormhole tests without a specific topology tag default to T3000
            if echo "$TAGS" | grep -q "requires_wormhole_b0"; then
              IS_HW="true"
              if ! echo "$TAGS" | grep -qE "requires_N150|requires_N300|requires_T3000|requires_galaxy"; then
                NEEDS_T3000="true"
              fi
            fi

            # Performance tests need dedicated perf runners for bare-metal isolation.
            # perf_bare_metal/perf_t3000 → T3000 perf runner, perf_tg → Galaxy perf runner.
            if echo "$TAGS" | grep -qE "perf_bare_metal|perf_device_bare_metal|perf_t3000"; then
              NEEDS_PERF_T3000="true"
            fi
            if echo "$TAGS" | grep -q "perf_tg"; then
              NEEDS_PERF_TG="true"
            fi

            if [ "$IS_HW" = "false" ]; then
              HAS_HOST="true"
            fi
          done

          echo "has_host_tests=$HAS_HOST" >> "$GITHUB_OUTPUT"
          echo "needs_n150=$NEEDS_N150" >> "$GITHUB_OUTPUT"
          echo "needs_n300=$NEEDS_N300" >> "$GITHUB_OUTPUT"
          echo "needs_t3000=$NEEDS_T3000" >> "$GITHUB_OUTPUT"
          echo "needs_blackhole=$NEEDS_BH" >> "$GITHUB_OUTPUT"
          echo "needs_galaxy_wh=$NEEDS_GALAXY_WH" >> "$GITHUB_OUTPUT"
          echo "needs_galaxy_bh=$NEEDS_GALAXY_BH" >> "$GITHUB_OUTPUT"
          echo "needs_perf_t3000=$NEEDS_PERF_T3000" >> "$GITHUB_OUTPUT"
          echo "needs_perf_tg=$NEEDS_PERF_TG" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "## Affected-Target Analysis" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Mode | \`${{ steps.query.outputs.mode }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test count | ${{ steps.query.outputs.test_count }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Host tests | ${{ steps.classify.outputs.has_host_tests }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| N150 (WH single) | ${{ steps.classify.outputs.needs_n150 }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| N300 (WH dual) | ${{ steps.classify.outputs.needs_n300 }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| T3000 (WH 8-card) | ${{ steps.classify.outputs.needs_t3000 }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Blackhole (P150) | ${{ steps.classify.outputs.needs_blackhole }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Galaxy WH | ${{ steps.classify.outputs.needs_galaxy_wh }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Galaxy BH | ${{ steps.classify.outputs.needs_galaxy_bh }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Perf T3000 | ${{ steps.classify.outputs.needs_perf_t3000 }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Perf Galaxy | ${{ steps.classify.outputs.needs_perf_tg }} |" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.query.outputs.mode }}" = "AFFECTED" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "<details><summary>Affected targets</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "${{ steps.query.outputs.affected_tests }}" | tr ' ' '\n' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          fi

  # -------------------------------------------------------------------------
  # Phase 2: Run host-only tests (no TT hardware required)
  # -------------------------------------------------------------------------
  host-tests:
    needs: determine-targets
    if: >-
      needs.determine-targets.outputs.mode != 'SKIP' &&
      needs.determine-targets.outputs.has_host_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run affected host tests
        run: |
          set -euo pipefail

          TAG_FILTER="${{ inputs.test-tag-filter || 'post_commit' }}"
          HW_EXCLUDE="-requires_wormhole_b0,-requires_blackhole,-requires_galaxy,-requires_N150,-requires_N300,-requires_T3000,-no_remote"

          if [ "${{ needs.determine-targets.outputs.mode }}" = "FULL_CI" ]; then
            echo "Running FULL CI (host-only tests)"
            bazel test //tests/... \
              --test_tag_filters="${TAG_FILTER},${HW_EXCLUDE}" \
              --test_output=errors \
              --jobs=auto \
              --local_test_jobs=4 \
              --build_tests_only \
              --flaky_test_attempts=2 \
              || true  # Don't fail the job on test failures; report them
          else
            TARGETS="${{ needs.determine-targets.outputs.affected_tests }}"
            echo "Running ${#TARGETS[@]} affected targets (host-only)"
            # shellcheck disable=SC2086
            bazel test $TARGETS \
              --test_tag_filters="${TAG_FILTER},${HW_EXCLUDE}" \
              --test_output=errors \
              --jobs=auto \
              --local_test_jobs=4 \
              --build_tests_only \
              --flaky_test_attempts=2 \
              || true
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-test-results-host
          path: |
            bazel-testlogs/**/test.xml
            bazel-testlogs/**/test.log
          retention-days: 14

  # -------------------------------------------------------------------------
  # Phase 3: Run device tests on per-SKU runners
  # -------------------------------------------------------------------------

  # N150 — Wormhole B0 single-chip
  device-tests-n150:
    needs: determine-targets
    if: >-
      needs.determine-targets.outputs.mode != 'SKIP' &&
      needs.determine-targets.outputs.needs_n150 == 'true'
    runs-on:
      - tt-ubuntu-2204-N150-viommu-stable
    timeout-minutes: 120
    container:
      options: "--device /dev/tenstorrent"
      volumes:
        - /dev/hugepages-1G:/dev/hugepages-1G
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run N150 device tests
        env:
          ARCH_NAME: wormhole_b0
          LOGURU_LEVEL: INFO
          GTEST_OUTPUT: xml:${{ github.workspace }}/generated/test_reports/
        run: |
          set -euo pipefail

          TAG_FILTER="${{ inputs.test-tag-filter || 'post_commit' }}"
          TAG_EXCLUDE="-frequently_hangs,-slow"
          # Select only tests tagged for N150
          HW_INCLUDE="requires_N150"

          if [ "${{ needs.determine-targets.outputs.mode }}" = "FULL_CI" ]; then
            echo "Running FULL CI (N150 device tests)"
            bazel test //tests/... \
              --test_tag_filters="${TAG_FILTER},${HW_INCLUDE},${TAG_EXCLUDE}" \
              --test_output=errors \
              --jobs=auto \
              --build_tests_only \
              --flaky_test_attempts=2 \
              || true
          else
            TARGETS="${{ needs.determine-targets.outputs.affected_tests }}"
            echo "Running affected N150 device tests"
            # shellcheck disable=SC2086
            bazel test $TARGETS \
              --test_tag_filters="${TAG_FILTER},${HW_INCLUDE},${TAG_EXCLUDE}" \
              --test_output=errors \
              --jobs=auto \
              --build_tests_only \
              --flaky_test_attempts=2 \
              || true
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-test-results-n150
          path: |
            bazel-testlogs/**/test.xml
            bazel-testlogs/**/test.log
          retention-days: 14

  # N300 — Wormhole B0 dual-chip
  device-tests-n300:
    needs: determine-targets
    if: >-
      needs.determine-targets.outputs.mode != 'SKIP' &&
      needs.determine-targets.outputs.needs_n300 == 'true'
    runs-on:
      - tt-ubuntu-2204-N300-viommu-stable
    timeout-minutes: 120
    container:
      options: "--device /dev/tenstorrent"
      volumes:
        - /dev/hugepages-1G:/dev/hugepages-1G
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run N300 device tests
        env:
          ARCH_NAME: wormhole_b0
          LOGURU_LEVEL: INFO
          GTEST_OUTPUT: xml:${{ github.workspace }}/generated/test_reports/
        run: |
          set -euo pipefail

          TAG_FILTER="${{ inputs.test-tag-filter || 'post_commit' }}"
          TAG_EXCLUDE="-frequently_hangs,-slow"
          HW_INCLUDE="requires_N300"

          if [ "${{ needs.determine-targets.outputs.mode }}" = "FULL_CI" ]; then
            echo "Running FULL CI (N300 device tests)"
            bazel test //tests/... \
              --test_tag_filters="${TAG_FILTER},${HW_INCLUDE},${TAG_EXCLUDE}" \
              --test_output=errors \
              --jobs=auto \
              --build_tests_only \
              --flaky_test_attempts=2 \
              || true
          else
            TARGETS="${{ needs.determine-targets.outputs.affected_tests }}"
            echo "Running affected N300 device tests"
            # shellcheck disable=SC2086
            bazel test $TARGETS \
              --test_tag_filters="${TAG_FILTER},${HW_INCLUDE},${TAG_EXCLUDE}" \
              --test_output=errors \
              --jobs=auto \
              --build_tests_only \
              --flaky_test_attempts=2 \
              || true
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-test-results-n300
          path: |
            bazel-testlogs/**/test.xml
            bazel-testlogs/**/test.log
          retention-days: 14

  # T3000 — Wormhole B0 8-card
  device-tests-t3000:
    needs: determine-targets
    if: >-
      needs.determine-targets.outputs.mode != 'SKIP' &&
      needs.determine-targets.outputs.needs_t3000 == 'true'
    runs-on:
      - arch-wormhole_b0
      - config-t3000
      - pipeline-functional
      - in-service
    timeout-minutes: 120
    container:
      options: "--device /dev/tenstorrent"
      volumes:
        - /dev/hugepages-1G:/dev/hugepages-1G
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run T3000 device tests
        env:
          ARCH_NAME: wormhole_b0
          TT_METAL_ENABLE_ERISC_IRAM: "1"
          LOGURU_LEVEL: INFO
          GTEST_OUTPUT: xml:${{ github.workspace }}/generated/test_reports/
        run: |
          set -euo pipefail

          TAG_FILTER="${{ inputs.test-tag-filter || 'post_commit' }}"
          TAG_EXCLUDE="-frequently_hangs,-slow"
          # T3000 runs Wormhole tests that aren't specific to other topologies.
          # This includes tests tagged requires_T3000 and generic requires_wormhole_b0.
          # Perf tests are excluded here — they run on dedicated pipeline-perf runners.
          HW_INCLUDE="requires_wormhole_b0"
          HW_EXCLUDE="-requires_N150,-requires_N300,-requires_galaxy,-requires_blackhole"
          PERF_EXCLUDE="-perf_bare_metal,-perf_device_bare_metal,-perf_t3000"

          if [ "${{ needs.determine-targets.outputs.mode }}" = "FULL_CI" ]; then
            echo "Running FULL CI (T3000 device tests)"
            bazel test //tests/... \
              --test_tag_filters="${TAG_FILTER},${HW_INCLUDE},${HW_EXCLUDE},${TAG_EXCLUDE},${PERF_EXCLUDE}" \
              --test_output=errors \
              --jobs=auto \
              --build_tests_only \
              --flaky_test_attempts=2 \
              || true
          else
            TARGETS="${{ needs.determine-targets.outputs.affected_tests }}"
            echo "Running affected T3000 device tests"
            # shellcheck disable=SC2086
            bazel test $TARGETS \
              --test_tag_filters="${TAG_FILTER},${HW_INCLUDE},${HW_EXCLUDE},${TAG_EXCLUDE},${PERF_EXCLUDE}" \
              --test_output=errors \
              --jobs=auto \
              --build_tests_only \
              --flaky_test_attempts=2 \
              || true
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-test-results-t3000
          path: |
            bazel-testlogs/**/test.xml
            bazel-testlogs/**/test.log
          retention-days: 14

  # Blackhole — P150 single-card
  device-tests-blackhole:
    needs: determine-targets
    if: >-
      needs.determine-targets.outputs.mode != 'SKIP' &&
      needs.determine-targets.outputs.needs_blackhole == 'true'
    runs-on:
      - tt-ubuntu-2204-P150b-stable
    timeout-minutes: 120
    container:
      options: "--device /dev/tenstorrent"
      volumes:
        - /dev/hugepages-1G:/dev/hugepages-1G
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Blackhole device tests
        env:
          ARCH_NAME: blackhole
          LOGURU_LEVEL: INFO
          GTEST_OUTPUT: xml:${{ github.workspace }}/generated/test_reports/
        run: |
          set -euo pipefail

          TAG_FILTER="${{ inputs.test-tag-filter || 'post_commit' }}"
          TAG_EXCLUDE="-frequently_hangs,-slow"
          # Select Blackhole tests that are not Galaxy
          HW_INCLUDE="requires_blackhole"
          HW_EXCLUDE="-requires_galaxy"

          if [ "${{ needs.determine-targets.outputs.mode }}" = "FULL_CI" ]; then
            echo "Running FULL CI (Blackhole device tests)"
            bazel test //tests/... \
              --test_tag_filters="${TAG_FILTER},${HW_INCLUDE},${HW_EXCLUDE},${TAG_EXCLUDE}" \
              --test_output=errors \
              --jobs=auto \
              --build_tests_only \
              --flaky_test_attempts=2 \
              || true
          else
            TARGETS="${{ needs.determine-targets.outputs.affected_tests }}"
            echo "Running affected Blackhole device tests"
            # shellcheck disable=SC2086
            bazel test $TARGETS \
              --test_tag_filters="${TAG_FILTER},${HW_INCLUDE},${HW_EXCLUDE},${TAG_EXCLUDE}" \
              --test_output=errors \
              --jobs=auto \
              --build_tests_only \
              --flaky_test_attempts=2 \
              || true
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-test-results-blackhole
          path: |
            bazel-testlogs/**/test.xml
            bazel-testlogs/**/test.log
          retention-days: 14

  # Galaxy (Wormhole) — 32-card Wormhole B0
  device-tests-galaxy-wh:
    needs: determine-targets
    if: >-
      needs.determine-targets.outputs.mode != 'SKIP' &&
      needs.determine-targets.outputs.needs_galaxy_wh == 'true'
    runs-on:
      - arch-wormhole_b0
      - pipeline-functional
      - topology-6u
      - in-service
    timeout-minutes: 180
    container:
      options: "--device /dev/tenstorrent"
      volumes:
        - /dev/hugepages-1G:/dev/hugepages-1G
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Galaxy (Wormhole) device tests
        env:
          ARCH_NAME: wormhole_b0
          TT_METAL_ENABLE_ERISC_IRAM: "1"
          LOGURU_LEVEL: INFO
          GTEST_OUTPUT: xml:${{ github.workspace }}/generated/test_reports/
        run: |
          set -euo pipefail

          TAG_FILTER="${{ inputs.test-tag-filter || 'post_commit' }}"
          TAG_EXCLUDE="-frequently_hangs,-slow"
          # requires_galaxy selects Galaxy tests; exclude Blackhole to keep only WH Galaxy.
          # Perf tests are excluded here — they run on dedicated pipeline-perf runners.
          HW_INCLUDE="requires_galaxy"
          HW_EXCLUDE="-requires_blackhole"
          PERF_EXCLUDE="-perf_tg"

          if [ "${{ needs.determine-targets.outputs.mode }}" = "FULL_CI" ]; then
            echo "Running FULL CI (Galaxy Wormhole device tests)"
            bazel test //tests/... \
              --test_tag_filters="${TAG_FILTER},${HW_INCLUDE},${HW_EXCLUDE},${TAG_EXCLUDE},${PERF_EXCLUDE}" \
              --test_output=errors \
              --jobs=auto \
              --build_tests_only \
              --flaky_test_attempts=2 \
              || true
          else
            TARGETS="${{ needs.determine-targets.outputs.affected_tests }}"
            echo "Running affected Galaxy Wormhole device tests"
            # shellcheck disable=SC2086
            bazel test $TARGETS \
              --test_tag_filters="${TAG_FILTER},${HW_INCLUDE},${HW_EXCLUDE},${TAG_EXCLUDE},${PERF_EXCLUDE}" \
              --test_output=errors \
              --jobs=auto \
              --build_tests_only \
              --flaky_test_attempts=2 \
              || true
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-test-results-galaxy-wh
          path: |
            bazel-testlogs/**/test.xml
            bazel-testlogs/**/test.log
          retention-days: 14

  # Galaxy (Blackhole) — 32-card Blackhole
  device-tests-galaxy-bh:
    needs: determine-targets
    if: >-
      needs.determine-targets.outputs.mode != 'SKIP' &&
      needs.determine-targets.outputs.needs_galaxy_bh == 'true'
    runs-on:
      - arch-blackhole
      - pipeline-functional
      - topology-6u
      - in-service
    timeout-minutes: 180
    container:
      options: "--device /dev/tenstorrent"
      volumes:
        - /dev/hugepages-1G:/dev/hugepages-1G
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Galaxy (Blackhole) device tests
        env:
          ARCH_NAME: blackhole
          TT_METAL_ENABLE_ERISC_IRAM: "1"
          LOGURU_LEVEL: INFO
          GTEST_OUTPUT: xml:${{ github.workspace }}/generated/test_reports/
        run: |
          set -euo pipefail

          TAG_FILTER="${{ inputs.test-tag-filter || 'post_commit' }}"
          TAG_EXCLUDE="-frequently_hangs,-slow"
          # requires_galaxy selects Galaxy tests; exclude Wormhole to keep only BH Galaxy
          HW_INCLUDE="requires_galaxy"
          HW_EXCLUDE="-requires_wormhole_b0"

          if [ "${{ needs.determine-targets.outputs.mode }}" = "FULL_CI" ]; then
            echo "Running FULL CI (Galaxy Blackhole device tests)"
            bazel test //tests/... \
              --test_tag_filters="${TAG_FILTER},${HW_INCLUDE},${HW_EXCLUDE},${TAG_EXCLUDE}" \
              --test_output=errors \
              --jobs=auto \
              --build_tests_only \
              --flaky_test_attempts=2 \
              || true
          else
            TARGETS="${{ needs.determine-targets.outputs.affected_tests }}"
            echo "Running affected Galaxy Blackhole device tests"
            # shellcheck disable=SC2086
            bazel test $TARGETS \
              --test_tag_filters="${TAG_FILTER},${HW_INCLUDE},${HW_EXCLUDE},${TAG_EXCLUDE}" \
              --test_output=errors \
              --jobs=auto \
              --build_tests_only \
              --flaky_test_attempts=2 \
              || true
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-test-results-galaxy-bh
          path: |
            bazel-testlogs/**/test.xml
            bazel-testlogs/**/test.log
          retention-days: 14

  # -------------------------------------------------------------------------
  # Phase 4: Performance tests on dedicated pipeline-perf runners
  #
  # Perf tests require bare-metal isolation (no co-tenancy), Tracy profiler
  # builds, and CPU governor pinned to "performance" to produce stable,
  # regression-trackable numbers. These mirror the CMake CI perf pipelines
  # (t3000-perf-tests, galaxy-perf-tests) but use Bazel's affected-target
  # analysis to only run the perf tests that are actually affected.
  # -------------------------------------------------------------------------

  # T3000 Performance — Wormhole B0 8-card (pipeline-perf runner)
  perf-tests-t3000:
    needs: determine-targets
    if: >-
      needs.determine-targets.outputs.mode != 'SKIP' &&
      needs.determine-targets.outputs.needs_perf_t3000 == 'true'
    runs-on:
      - arch-wormhole_b0
      - config-t3000
      - pipeline-perf
      - in-service
    timeout-minutes: 120
    container:
      options: "--device /dev/tenstorrent --privileged -v /sys:/sys"
      volumes:
        - /dev/hugepages-1G:/dev/hugepages-1G
        - /mnt/MLPerf:/mnt/MLPerf:ro
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable performance CPU governor
        uses: ./.github/actions/set-cpu-governor
        with:
          governor: performance

      - name: Run T3000 perf tests (Tracy-enabled)
        env:
          ARCH_NAME: wormhole_b0
          TT_METAL_ENABLE_ERISC_IRAM: "1"
          LOGURU_LEVEL: INFO
          TRACY_NO_INVARIANT_CHECK: "1"
          GTEST_OUTPUT: xml:${{ github.workspace }}/generated/test_reports/
          HF_HUB_CACHE: /mnt/MLPerf/huggingface/hub
        run: |
          set -euo pipefail

          # Perf tags that route to the T3000 perf runner.
          PERF_INCLUDE="perf_bare_metal,perf_device_bare_metal,perf_t3000"
          HW_INCLUDE="requires_wormhole_b0"
          HW_EXCLUDE="-requires_N150,-requires_N300,-requires_galaxy,-requires_blackhole"
          TAG_EXCLUDE="-frequently_hangs"

          if [ "${{ needs.determine-targets.outputs.mode }}" = "FULL_CI" ]; then
            echo "Running FULL CI (T3000 perf tests with Tracy)"
            bazel test //tests/... \
              --config=tracy \
              --test_tag_filters="${PERF_INCLUDE},${HW_INCLUDE},${HW_EXCLUDE},${TAG_EXCLUDE}" \
              --test_output=errors \
              --jobs=auto \
              --build_tests_only \
              || true
          else
            TARGETS="${{ needs.determine-targets.outputs.affected_tests }}"
            echo "Running affected T3000 perf tests with Tracy"
            # shellcheck disable=SC2086
            bazel test $TARGETS \
              --config=tracy \
              --test_tag_filters="${PERF_INCLUDE},${HW_INCLUDE},${HW_EXCLUDE},${TAG_EXCLUDE}" \
              --test_output=errors \
              --jobs=auto \
              --build_tests_only \
              || true
          fi

      - name: Collect perf reports
        if: always()
        run: |
          # Merge perf result CSVs if the merge script exists
          if [ -f models/perf/merge_perf_results.py ]; then
            python3 models/perf/merge_perf_results.py || true
          fi

      - name: Save benchmark data
        id: save-benchmark-data
        if: ${{ !cancelled() }}
        run: |
          if [ -d "generated/benchmark_data" ]; then
            echo "has_benchmark_data=true" >> "$GITHUB_OUTPUT"
            python3 .github/scripts/data_analysis/create_benchmark_with_environment_json.py || true
          else
            echo "has_benchmark_data=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload benchmark data via SFTP
        if: ${{ !cancelled() && steps.save-benchmark-data.outputs.has_benchmark_data == 'true' }}
        uses: ./.github/actions/upload-data-via-sftp
        with:
          ssh-private-key: ${{ secrets.SFTP_BENCHMARK_WRITER_KEY }}
          sftp-batchfile: .github/actions/upload-data-via-sftp/benchmark_data_batchfile.txt
          username: ${{ secrets.SFTP_BENCHMARK_WRITER_USERNAME }}
          hostname: ${{ secrets.SFTP_BENCHMARK_WRITER_HOSTNAME }}

      - name: Upload perf report CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-perf-report-t3000
          path: |
            Models_Perf_*.csv
            Models_Device_Perf_*.csv
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-test-results-perf-t3000
          path: |
            bazel-testlogs/**/test.xml
            bazel-testlogs/**/test.log
          retention-days: 14

      - name: Restore CPU governor
        if: always()
        uses: ./.github/actions/set-cpu-governor
        with:
          governor: ondemand

  # Galaxy Performance — Wormhole B0 32-card (pipeline-perf runner)
  perf-tests-galaxy:
